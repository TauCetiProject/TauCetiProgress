name: progress-merge

# Validate a generated progress pull request and, only if every check passes, merge it.
#
# Called by TauCetiRoadmap's own `progress-merge.yml`, pinned to a full SHA of this repository (the
# same discipline TauCeti uses when it calls TauCetiReview's reusable workflows).
#
# WHY THIS IS THE WHOLE GATE. TauCetiRoadmap's `main` ruleset requires a code-owner approval plus
# the `build` check, and a ruleset cannot scope that to a path. So the only way a generated report
# lands unattended is the roadmap App's `always` bypass -- and a bypass actor bypasses the entire
# ruleset, status checks included. Anyone may open a pull request there, including from a fork.
# Everything that keeps this safe is therefore in the `validate` job below.
#
# The two jobs are split so that the read-only job does all the untrusted work and the job holding a
# write token does nothing but merge:
#
#   validate  default GITHUB_TOKEN (read-only org-wide). Collects the pull request pinned to two
#             immutable SHAs and runs progress.gate. Never checks out or executes PR content.
#   merge     needs: validate. Mints the App token and merges, bound to BOTH the validated head and
#             the validated main.
#
# Announcing is a *separate* workflow (announce.yml, triggered by the push to main), so the App token
# and the Zulip key never live in the same job, and a lost announcement can be retried without
# re-merging.
#
# Third-party actions are pinned to full commit SHAs, not tags: the token-minting step receives the
# bypass App's private key, and a moved tag would hand that key to whatever the tag now points at.

on:
  workflow_call:
    inputs:
      pr:
        description: The pull request number to consider.
        required: true
        type: number
      progress_ref:
        description: The TauCetiProgress ref to validate with (must equal the `uses:` SHA).
        required: true
        type: string
      app_id:
        description: >
          Numeric id of the App whose token performs the merge. It MUST be an App that the target
          repository's ruleset lists as a bypass actor, or the merge is refused for want of a
          code-owner review. For TauCetiRoadmap that is `tau-ceti-roadmap-sync`
          (`vars.SYNC_BOT_APP_ID`), NOT the review bot in `APP_ID`, which is a bypass actor on
          TauCeti but not here. An App id is not a secret, hence an input.
        required: true
        type: string
      dry_run:
        description: Validate and report, but never merge.
        required: false
        default: false
        type: boolean
    secrets:
      APP_PRIVATE_KEY:
        required: true

# The floor for both jobs. `validate` raises its own to write, for one comment; `merge` does not
# need it at all, because everything it writes uses the App token rather than this one.
permissions:
  contents: read
  pull-requests: read

# DELIBERATELY NOT SERIALISED.
#
# An earlier version put every call into one repository-wide `progress-merge` concurrency group, so
# that two reports could never be validated and merged at once, each one's validity depending on
# where `main` is. That reasoning was right about the hazard and wrong about the remedy. GitHub keeps
# one running and one pending run per group and discards the older pending one when a newer event
# arrives, so with anyone able to open and synchronise a `progress/*` pull request, the group becomes
# a lever: a steady trickle of events evicts the queued legitimate run indefinitely, and nothing
# reports an error.
#
# Concurrent runs are safe without it. The landing step is a compare-and-swap: the commit names the
# validated `main` SHA as its only parent and the ref update sets `force=false`, so if another report
# landed in between, this one's update is not a fast-forward and is rejected. The loser fails its
# swap and the pull request is simply rebuilt on the newer `main` next round -- which is exactly what
# the serialisation was there to prevent, achieved by the mechanism that was already doing the work.

jobs:
  validate:
    runs-on: ubuntu-latest
    # `write` ONLY here, and only so a refusal can be explained on the pull request itself. Anyone
    # may publish a report now, so a contributor whose report is refused would otherwise get no
    # feedback at all: the reason would sit in the Actions log of a workflow in a repository they may
    # not be able to read. This job never checks out or executes pull-request content, and the
    # comment body is written to a file rather than interpolated into a shell.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      main_sha: ${{ steps.gate.outputs.main_sha }}
      area: ${{ steps.gate.outputs.area }}
    steps:
      # The validator itself, at exactly the ref the caller pinned. Checking out this repository
      # (never the pull request) is what keeps the executed code trusted.
      - name: Check out the validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: TauCetiProject/TauCetiProgress
          ref: ${{ inputs.progress_ref }}
          path: validator
          persist-credentials: false

      # No checkout of the roadmap repository at all. The collector reads current `main` and the head
      # through the API at pinned SHAs, so there is no working tree that could drift from what is
      # validated, and nothing from the pull request ever touches this runner's disk.
      - name: Collect the pull request, pinned to immutable SHAs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 validator/.github/scripts/collect.py \
            --repo "$REPO" --pr "$PR" --out bundle.json

      # The gate. Exit 0 allows, exit 3 is a considered refusal, anything else is a crash. A crash
      # must NOT read as a refusal: the two are different, and conflating them turns an unexpected
      # failure into a quiet no-op. Note 3 rather than 2, because `argparse` exits 2 on a usage
      # error; and the exit code must AGREE with the output, so a refusal also has to say REFUSED.
      - name: Run the gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -c 'import sys; sys.path.insert(0, "validator"); from progress.gate import main; sys.exit(main())' \
            --bundle bundle.json > gate.out 2>&1
          rc=$?
          cat gate.out
          {
            echo "head_sha=$(python3 -c 'import json;print(json.load(open("bundle.json")).get("head_sha",""))')"
            echo "main_sha=$(python3 -c 'import json;print(json.load(open("bundle.json")).get("main_sha",""))')"
            echo "area=$(python3 -c 'import json,re;a=json.load(open("bundle.json")).get("area","");print(a if re.fullmatch(r"[A-Za-z0-9]+", a or "") else "")')"
          } >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "verdict=allow" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 3 ] && head -n1 gate.out | grep -q '^REFUSED: '; then
            echo "verdict=refuse" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error title=progress gate crashed::exit $rc — see the log above"
          exit "$rc"

      # A refusal is a normal outcome (a human pull request touching these paths, say), so it leaves
      # a comment and stops rather than failing the run.
      #
      # The refusal text quotes attacker-controlled strings -- a path from the diff, for instance --
      # so it is passed through `env:` and printed with printf. Interpolating `${{ }}` straight into
      # `run:` would splice that text into the shell, and this job holds a token.
      - name: Explain a refusal on the pull request
        if: steps.gate.outputs.verdict == 'refuse'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            printf 'The automated progress gate did not merge this pull request.\n\n```\n'
            sed -n 's/^REFUSED: //p' gate.out
            printf '```\n\nIt is left for a human to review.\n'
          } > refusal.md
          printf 'gate refused:\n'
          cat refusal.md
          # Best effort. A refusal is a normal outcome, so failing to describe it must not turn the
          # run red -- the verdict is already recorded in the job output either way.
          gh pr comment "$PR" --repo "$REPO" --body-file refusal.md \
            || echo "::warning title=refusal not posted::could not comment on #$PR" 

  merge:
    needs: validate
    if: needs.validate.outputs.verdict == 'allow' && inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      # Minted only after validation succeeded, and scoped to this repository.
      - name: Mint the App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name || 'TauCetiRoadmap' }}
          permission-pull-requests: write
          permission-contents: write

      # The write is a compare-and-swap on the ref, NOT a pull-request merge.
      #
      # `gh pr merge` was the wrong instrument, and its two failures had the same root cause: it
      # depends on pull-request state that stays mutable right up to the moment it runs.
      #
      #   * The base can be RETARGETED after validation. `--match-head-commit` pins only the head, so
      #     an unchanged head would have been merged into a different base -- against which it can
      #     alter far more than the two files that were checked.
      #   * `main` can advance between reading it and merging, and a three-way merge then produces
      #     bytes nobody validated.
      #
      # Constructing the commit explicitly removes both, because nothing about the pull request is
      # consulted at write time. The gate established that the head is `ahead` of the validated main
      # with `behind_by == 0` and differs in exactly the two generated files, so the head's TREE is
      # already the intended post-merge tree. Committing that tree with the validated main as its only
      # parent is precisely the squash that was wanted, and a non-forced ref update lands it only if
      # `main` is still where it was: GitHub rejects a non-fast-forward, and our commit can only
      # fast-forward a `main` that has not moved. If anything landed in between, the update fails and
      # nothing happens.
      - name: Land the validated tree by compare-and-swap on refs/heads/main
        id: land
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          MAIN_SHA: ${{ needs.validate.outputs.main_sha }}
          AREA: ${{ needs.validate.outputs.area }}
        run: |
          set -euo pipefail

          # The tree of the exact head that was validated. Named by SHA, so it cannot have changed.
          tree="$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq .tree.sha)"
          printf 'validated head %s carries tree %s\n' "${HEAD_SHA:0:7}" "${tree:0:7}"

          # Message written here rather than taken from the pull request: the title is mutable and
          # attacker-influenced, and the `progress:` prefix is load-bearing (the daily cadence check
          # finds the last update by scanning commit subjects for it).
          # `AREA` is re-validated as alphanumeric when it is exported, so it cannot inject here.
          message="$(printf 'progress: %s report\n\nValidated head %s over main %s.\nCloses #%s.\n' \
            "$AREA" "$HEAD_SHA" "$MAIN_SHA" "$PR")"

          commit="$(gh api -X POST "repos/$REPO/git/commits" \
            -f message="$message" \
            -f tree="$tree" \
            -f parents[]="$MAIN_SHA" \
            --jq .sha)"
          printf 'built %s (tree %s, parent %s)\n' "${commit:0:7}" "${tree:0:7}" "${MAIN_SHA:0:7}"

          # force=false is the compare-and-swap. It fails if main is no longer at MAIN_SHA, because
          # then this commit is not a fast-forward of it.
          #
          # A failed PATCH is ambiguous on its own: the update may have been applied server-side and
          # the response lost. Believing "it failed" in that case would leave the report on main with
          # its pull request still open, which the planner then treats as permanently in flight. So on
          # any error the ref is re-read and the three cases are distinguished explicitly.
          if gh api -X PATCH "repos/$REPO/git/refs/heads/main" \
               -f sha="$commit" -F force=false > /dev/null 2> update.err; then
            landed=true
          else
            after="$(gh api "repos/$REPO/commits/main" --jq .sha || echo unknown)"
            if [ "$after" = "$commit" ]; then
              echo "::notice::the update landed despite the error response"
              landed=true
            elif [ "$after" = "$MAIN_SHA" ]; then
              echo "::warning title=not landed::main is unchanged at ${MAIN_SHA:0:7}"
              cat update.err
              landed=false
            else
              echo "::warning title=main moved::main is now ${after:0:7}; this report was not landed"
              cat update.err
              landed=false
            fi
          fi
          echo "landed=$landed" >> "$GITHUB_OUTPUT"
          if [ "$landed" != "true" ]; then
            exit 0
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf 'main advanced %s -> %s\n' "${MAIN_SHA:0:7}" "${commit:0:7}"

      # The content is on main, but the pull request is not "merged" in GitHub's sense, so close it
      # explicitly. Leaving it open would make the next planning run treat the area as permanently in
      # flight -- the window can never be revalidated, because main has moved past it.
      #
      # Closing comes FIRST and is retried; the comment and the branch deletion are cosmetic and must
      # never be the reason the pull request stays open. The step also fails loudly if the close did
      # not take, because a stranded open pull request needs a human.
      - name: Close the pull request now its content has landed
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.land.outputs.commit }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            state="$(gh pr view "$PR" --repo "$REPO" --json state --jq .state || echo UNKNOWN)"
            if [ "$state" = "CLOSED" ] || [ "$state" = "MERGED" ]; then
              printf 'pull request #%s is %s\n' "$PR" "$state"
              break
            fi
            gh pr close "$PR" --repo "$REPO" || true
            sleep "$attempt"
          done
          state="$(gh pr view "$PR" --repo "$REPO" --json state --jq .state || echo UNKNOWN)"
          if [ "$state" != "CLOSED" ] && [ "$state" != "MERGED" ]; then
            echo "::error title=pull request stranded::#$PR is $state but its content landed as $COMMIT"
            exit 1
          fi
          # Best effort from here: neither of these affects correctness.
          gh pr comment "$PR" --repo "$REPO" \
            --body "Landed on \`main\` as $COMMIT by compare-and-swap on the validated tree." || true
          # Delete the source branch ONLY when it is in this repository. Branch names are a pure
          # function of the window, so a fork's branch has the same name as the canonical one would:
          # deleting `repos/$REPO/git/refs/heads/<name>` after landing a FORK pull request would
          # delete an unrelated canonical branch that happens to share the name.
          head_repo="$(gh pr view "$PR" --repo "$REPO" --json headRepository,headRepositoryOwner \
                       --jq '(.headRepositoryOwner.login // "") + "/" + (.headRepository.name // "")')"
          head_ref="$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq .headRefName)"
          if [ "$head_repo" = "$REPO" ] && [ -n "$head_ref" ]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$head_ref" > /dev/null 2>&1 || true
          else
            echo "head is in $head_repo, not $REPO; leaving its branch alone"
          fi
