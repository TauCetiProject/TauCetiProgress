name: progress-merge

# Validate a generated progress pull request and, only if every check passes, merge it.
#
# Called by TauCetiRoadmap's own `progress-merge.yml`, pinned to a full SHA of this repository (the
# same discipline TauCeti uses when it calls TauCetiReview's reusable workflows).
#
# WHY THIS IS THE WHOLE GATE. TauCetiRoadmap's `main` ruleset requires a code-owner approval plus
# the `build` check, and a ruleset cannot scope that to a path. So the only way a generated report
# lands unattended is the roadmap App's `always` bypass -- and a bypass actor bypasses the entire
# ruleset, status checks included. Anyone may open a pull request there, including from a fork.
# Everything that keeps this safe is therefore in the `validate` job below.
#
# The two jobs are split so that the read-only job does all the untrusted work and the job holding a
# write token does nothing but merge:
#
#   validate  default GITHUB_TOKEN (read-only org-wide). Collects the pull request pinned to two
#             immutable SHAs and runs progress.gate. Never checks out or executes PR content.
#   merge     needs: validate. Mints the App token and merges, bound to BOTH the validated head and
#             the validated main.
#
# Announcing is a *separate* workflow (announce.yml, triggered by the push to main), so the App token
# and the Zulip key never live in the same job, and a lost announcement can be retried without
# re-merging.
#
# Third-party actions are pinned to full commit SHAs, not tags: the token-minting step receives the
# bypass App's private key, and a moved tag would hand that key to whatever the tag now points at.

on:
  workflow_call:
    inputs:
      pr:
        description: The pull request number to consider.
        required: true
        type: number
      progress_ref:
        description: The TauCetiProgress ref to validate with (must equal the `uses:` SHA).
        required: true
        type: string
      allowed_user_ids:
        description: Comma-separated numeric GitHub user ids permitted to author these PRs.
        required: true
        type: string
      app_id:
        description: >
          Numeric id of the App whose token performs the merge. It MUST be an App that the target
          repository's ruleset lists as a bypass actor, or the merge is refused for want of a
          code-owner review. For TauCetiRoadmap that is `tau-ceti-roadmap-sync`
          (`vars.SYNC_BOT_APP_ID`), NOT the review bot in `APP_ID`, which is a bypass actor on
          TauCeti but not here. An App id is not a secret, hence an input.
        required: true
        type: string
      dry_run:
        description: Validate and report, but never merge.
        required: false
        default: false
        type: boolean
    secrets:
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

# Repository-wide, not per-PR: two progress PRs must never be validated and merged concurrently,
# because each one's validity depends on where `main` currently is.
concurrency:
  group: progress-merge
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      main_sha: ${{ steps.gate.outputs.main_sha }}
    steps:
      # The validator itself, at exactly the ref the caller pinned. Checking out this repository
      # (never the pull request) is what keeps the executed code trusted.
      - name: Check out the validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: TauCetiProject/TauCetiProgress
          ref: ${{ inputs.progress_ref }}
          path: validator
          persist-credentials: false

      # No checkout of the roadmap repository at all. The collector reads current `main` and the head
      # through the API at pinned SHAs, so there is no working tree that could drift from what is
      # validated, and nothing from the pull request ever touches this runner's disk.
      - name: Collect the pull request, pinned to immutable SHAs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          ALLOWED: ${{ inputs.allowed_user_ids }}
        run: |
          set -euo pipefail
          python3 validator/.github/scripts/collect.py \
            --repo "$REPO" --pr "$PR" --allowed-user-ids "$ALLOWED" --out bundle.json

      # The gate. Exit 0 allows, exit 2 is a considered refusal, anything else is a crash. A crash
      # must NOT read as a refusal: the two are different, and conflating them turns an unexpected
      # failure into a quiet no-op.
      - name: Run the gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -c 'import sys; sys.path.insert(0, "validator"); from progress.gate import main; sys.exit(main())' \
            --bundle bundle.json > gate.out 2>&1
          rc=$?
          cat gate.out
          {
            echo "head_sha=$(python3 -c 'import json;print(json.load(open("bundle.json")).get("head_sha",""))')"
            echo "main_sha=$(python3 -c 'import json;print(json.load(open("bundle.json")).get("main_sha",""))')"
          } >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "verdict=allow" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 2 ]; then
            echo "verdict=refuse" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error title=progress gate crashed::exit $rc — see the log above"
          exit "$rc"

      # A refusal is a normal outcome (a human pull request touching these paths, say), so it leaves
      # a comment and stops rather than failing the run.
      #
      # The refusal text quotes attacker-controlled strings -- a path from the diff, for instance --
      # so it is passed through `env:` and printed with printf. Interpolating `${{ }}` straight into
      # `run:` would splice that text into the shell, and this job holds a token.
      - name: Explain a refusal on the pull request
        if: steps.gate.outputs.verdict == 'refuse'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            printf 'The automated progress gate did not merge this pull request.\n\n```\n'
            sed -n 's/^REFUSED: //p' gate.out
            printf '```\n\nIt is left for a human to review.\n'
          } > refusal.md
          printf 'gate refused:\n'
          cat refusal.md

  merge:
    needs: validate
    if: needs.validate.outputs.verdict == 'allow' && inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      # Minted only after validation succeeded, and scoped to this repository.
      - name: Mint the App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name || 'TauCetiRoadmap' }}
          permission-pull-requests: write
          permission-contents: write

      # Two independent bindings, because the merge must land EXACTLY the bytes that were validated:
      #
      #   --match-head-commit  the pull request head has not moved since validation.
      #   the ref update       `main` has not moved since validation.
      #
      # The second is the one `gh pr merge` alone cannot give. The gate has already established that
      # the head contains current main (`behind_by == 0`), so the merge is a fast-forward of content
      # and the post-merge bytes are the head's bytes. Re-reading main here and refusing if it has
      # advanced turns that into a compare-and-swap: if anything landed on main in between -- another
      # bypass actor, a human -- the merge is abandoned rather than three-way merged into something
      # nobody checked.
      - name: Merge, bound to the validated head and the validated main
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          MAIN_SHA: ${{ needs.validate.outputs.main_sha }}
        run: |
          set -euo pipefail
          now="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$now" != "$MAIN_SHA" ]; then
            echo "::warning title=main moved::main is now ${now:0:7}, validated against ${MAIN_SHA:0:7}; not merging"
            exit 0
          fi
          printf 'merging #%s at %s onto main %s\n' "$PR" "${HEAD_SHA:0:7}" "${MAIN_SHA:0:7}"
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"

          # Confirm what actually landed: main must now be a commit whose tree came from the head we
          # validated. A mismatch means something merged concurrently despite the checks above, and
          # that is worth failing loudly over rather than discovering later.
          after="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$after" = "$MAIN_SHA" ]; then
            echo "::error title=merge did not land::main is still ${MAIN_SHA:0:7}"
            exit 1
          fi
          printf 'main advanced %s -> %s\n' "${MAIN_SHA:0:7}" "${after:0:7}"
