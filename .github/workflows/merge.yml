name: progress-merge

# Validate a generated progress pull request and, only if every check passes, merge it.
#
# Called by TauCetiRoadmap's own `progress-merge.yml`, pinned to a full SHA of this repository (the
# same discipline TauCeti uses when it calls TauCetiReview's reusable workflows).
#
# WHY THIS IS THE WHOLE GATE. TauCetiRoadmap's `main` ruleset requires a code-owner approval plus
# the `build` check, and a ruleset cannot scope that to a path. So the only way a generated report
# lands unattended is the roadmap App's `always` bypass -- and a bypass actor bypasses the entire
# ruleset, status checks included. Anyone may open a pull request there, including from a fork.
# Everything that keeps this safe is therefore in the `validate` job below.
#
# The two jobs are split so that the read-only job does all the untrusted work and the job holding a
# write token does nothing but merge:
#
#   validate  default GITHUB_TOKEN (read-only org-wide). Collects the pull request pinned to two
#             immutable SHAs and runs progress.gate. Never checks out or executes PR content.
#   merge     needs: validate. Mints the App token and writes the two validated blobs into `main`,
#             bound to the blob ids the gate computed and to the area's files on the validated main.
#
# Announcing is a *separate* workflow (announce.yml, triggered by the push to main), so the App token
# and the Zulip key never live in the same job, and a lost announcement can be retried without
# re-merging.
#
# Third-party actions are pinned to full commit SHAs, not tags: the token-minting step receives the
# bypass App's private key, and a moved tag would hand that key to whatever the tag now points at.

on:
  workflow_call:
    inputs:
      tools_repository:
        type: string
        default: TauCetiProject/TauCetiTools
      tools_ref:
        type: string
        default: ''
      project_conf:
        type: string
        default: ''
      pr:
        description: The pull request number to consider.
        required: true
        type: number
      progress_ref:
        description: The TauCetiProgress ref to validate with (must equal the `uses:` SHA).
        required: true
        type: string
      app_id:
        description: >
          Numeric id of the App whose token performs the merge. It MUST be an App that the target
          repository's ruleset lists as a bypass actor, or the merge is refused for want of a
          code-owner review. For TauCetiRoadmap that is `tau-ceti-roadmap-sync`
          (`vars.SYNC_BOT_APP_ID`), NOT the review bot in `APP_ID`, which is a bypass actor on
          TauCeti but not here. An App id is not a secret, hence an input.
        required: true
        type: string
      dry_run:
        description: Validate and report, but never merge.
        required: false
        default: false
        type: boolean
    secrets:
      APP_PRIVATE_KEY:
        required: true

# The floor for both jobs. `validate` raises its own to write, for one comment; `merge` does not
# need it at all, because everything it writes uses the App token rather than this one.
permissions:
  contents: read
  pull-requests: read

# DELIBERATELY NOT SERIALISED.
#
# An earlier version put every call into one repository-wide `progress-merge` concurrency group, so
# that two reports could never be validated and merged at once, each one's validity depending on
# where `main` is. That reasoning was right about the hazard and wrong about the remedy. GitHub keeps
# one running and one pending run per group and discards the older pending one when a newer event
# arrives, so with anyone able to open and synchronise a `progress/*` pull request, the group becomes
# a lever: a steady trickle of events evicts the queued legitimate run indefinitely, and nothing
# reports an error.
#
# Concurrent runs are safe without it. The landing step is a compare-and-swap: the commit names the
# `main` it was built on as its only parent and the ref update sets `force=false`, so if anything
# landed in between, the update is rejected. The loser re-reads `main` and tries again only if this
# area's files there are still the ones it validated against; if another report for the same area
# got there first, it stops, and the sweep after that report's landing closes it.

jobs:
  validate:
    runs-on: ubuntu-latest
    # `write` ONLY here, and only so a refusal can be explained on the pull request itself. Anyone
    # may publish a report now, so a contributor whose report is refused would otherwise get no
    # feedback at all: the reason would sit in the Actions log of a workflow in a repository they may
    # not be able to read. This job never checks out or executes pull-request content, and the
    # comment body is written to a file rather than interpolated into a shell.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      main_sha: ${{ steps.gate.outputs.main_sha }}
      area: ${{ steps.gate.outputs.area }}
      parent: ${{ steps.gate.outputs.parent }}
      blobs: ${{ steps.gate.outputs.blobs }}
      roadmap_dir: ${{ steps.gate.outputs.roadmap_dir }}
      completed_dir: ${{ steps.gate.outputs.completed_dir }}
    steps:
      # The validator itself, at exactly the ref the caller pinned. Checking out this repository
      # (never the pull request) is what keeps the executed code trusted.
      - name: Check out the validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: TauCetiProject/TauCetiProgress
          ref: ${{ inputs.progress_ref }}
          path: validator
          persist-credentials: false

      - name: Checkout configured shared tools
        if: inputs.tools_ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tools_repository }}
          ref: ${{ inputs.tools_ref }}
          path: .tauceti-tools
          persist-credentials: false
      - name: Load project configuration
        env:
          PYTHONPATH: ${{ github.workspace }}/.tauceti-tools
          PROJECT_CONF: ${{ inputs.project_conf }}
        run: |
          if [ -n "$PROJECT_CONF" ]; then
            test -n '${{ inputs.tools_ref }}'
            python3 -m tauceti_tools config environment --conf "$PROJECT_CONF" --github-env "$GITHUB_ENV"
          else
            # Legacy callers still need the pinned package dependency.
            python3 -m pip install ./validator
          fi
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"

      # No checkout of the roadmap repository at all. The collector reads current `main` and the head
      # through the API at pinned SHAs, so there is no working tree that could drift from what is
      # validated, and nothing from the pull request ever touches this runner's disk.
      - name: Collect the pull request, pinned to immutable SHAs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 validator/.github/scripts/collect.py \
            --repo "$REPO" --pr "$PR" --out bundle.json

      # The gate. Exit 0 allows, exit 3 is a considered refusal, exit 4 means the `build` check has
      # not finished yet, anything else is a crash. A crash must NOT read as a refusal: the two are
      # different, and conflating them turns an unexpected failure into a quiet no-op. Note 3 rather
      # than 2, because `argparse` exits 2 on a usage error; and the exit code must AGREE with the
      # output, so a refusal also has to say REFUSED, and a pending verdict PENDING.
      - name: Run the gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -c 'import sys; sys.path.insert(0, "validator"); from progress.gate import main; sys.exit(main())' \
            --bundle bundle.json --result result.json > gate.out 2>&1
          rc=$?
          cat gate.out
          {
            echo "head_sha=$(python3 -c 'import json;print(json.load(open("bundle.json")).get("head_sha",""))')"
            echo "main_sha=$(python3 -c 'import json;print(json.load(open("bundle.json")).get("main_sha",""))')"
            echo "area=$(python3 -c 'import json,re;a=json.load(open("bundle.json")).get("area","");print(a if re.fullmatch(r"[A-Za-z0-9]+", a or "") else "")')"
            echo "roadmap_dir=${TAUCETI_ROADMAP_DIR:-TauCetiRoadmap}"
            echo "completed_dir=${TAUCETI_COMPLETED_DIR:-Completed}"
          } >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            {
              echo "parent=$(jq -r .parent result.json)"
              echo "blobs=$(jq -c .blobs result.json)"
              echo "verdict=allow"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 3 ] && head -n1 gate.out | grep -q '^REFUSED: '; then
            echo "verdict=refuse" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Not a refusal: the caller re-runs this gate when CI completes, and that run decides.
          # Nothing is posted, because a comment saying "did not merge" on a report that lands
          # minutes later is noise, and on a report whose re-check never comes it reads as final.
          if [ "$rc" -eq 4 ] && head -n1 gate.out | grep -q '^PENDING: '; then
            echo "verdict=pending" >> "$GITHUB_OUTPUT"
            echo "::notice title=waiting for build::$(sed -n 's/^PENDING: //p' gate.out | head -n1)"
            exit 0
          fi
          echo "::error title=progress gate crashed::exit $rc — see the log above"
          exit "$rc"

      # A refusal is a normal outcome (a human pull request touching these paths, say), so it leaves
      # a comment and stops rather than failing the run.
      #
      # The refusal text quotes attacker-controlled strings -- a path from the diff, for instance --
      # so it is passed through `env:` and printed with printf. Interpolating `${{ }}` straight into
      # `run:` would splice that text into the shell, and this job holds a token.
      - name: Explain a refusal on the pull request
        if: steps.gate.outputs.verdict == 'refuse'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            printf 'The automated progress gate did not merge this pull request.\n\n```\n'
            sed -n 's/^REFUSED: //p' gate.out
            printf '```\n\nIt is left for a human to review.\n'
          } > refusal.md
          printf 'gate refused:\n'
          cat refusal.md
          # Best effort. A refusal is a normal outcome, so failing to describe it must not turn the
          # run red -- the verdict is already recorded in the job output either way.
          gh pr comment "$PR" --repo "$REPO" --body-file refusal.md \
            || echo "::warning title=refusal not posted::could not comment on #$PR" 

  merge:
    needs: validate
    if: needs.validate.outputs.verdict == 'allow' && inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      # Minted only after validation succeeded, and scoped to this repository.
      - name: Mint the App token
        id: token
        # The caller supplies an App ID, so stay on the warning-free Node-24 release before v3.1
        # deprecated app-id in favour of a distinct client ID.
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859  # v3.0.0
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name || 'TauCetiRoadmap' }}
          permission-pull-requests: write
          permission-contents: write

      # The write is a compare-and-swap on the ref, NOT a pull-request merge.
      #
      # `gh pr merge` was the wrong instrument, and its two failures had the same root cause: it
      # depends on pull-request state that stays mutable right up to the moment it runs.
      #
      #   * The base can be RETARGETED after validation. `--match-head-commit` pins only the head, so
      #     an unchanged head would have been merged into a different base -- against which it can
      #     alter far more than the two files that were checked.
      #   * `main` can advance between reading it and merging, and a three-way merge then produces
      #     bytes nobody validated.
      #
      # Constructing the commit explicitly removes both, because nothing about the pull request is
      # consulted at write time. Nor is the head's tree: the gate validated two blobs against this
      # area's files on `main`, and the commit is `main`'s own tree with exactly those two blobs
      # written in, by the ids the gate computed from the bytes it checked. So the head does not need
      # to contain current `main`, and nothing that landed since it was built is touched.
      #
      # `main` may move while this runs. The verdict read `main` in exactly four places: the two
      # files (the append-only baseline and the cursor), README.md (that the roadmap exists), and the
      # date `PROGRESS.md` last changed (the cadence). If all four read the same on the new `main`,
      # the verdict is the same there, so the commit is rebuilt on it and swapped again. If any
      # differs, it stops.
      - name: Land the validated blobs by compare-and-swap on refs/heads/main
        id: land
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          MAIN_SHA: ${{ needs.validate.outputs.main_sha }}
          AREA: ${{ needs.validate.outputs.area }}
          PARENT: ${{ needs.validate.outputs.parent }}
          BLOBS: ${{ needs.validate.outputs.blobs }}
          ROADMAP_DIR: ${{ needs.validate.outputs.roadmap_dir }}
          COMPLETED_DIR: ${{ needs.validate.outputs.completed_dir }}
        run: |
          set -euo pipefail

          # Re-checked here rather than trusted, because this job holds the write token.
          if ! [[ "$AREA" =~ ^[A-Za-z0-9]+$ ]] \
             || { [ "$PARENT" != "$ROADMAP_DIR" ] && [ "$PARENT" != "$COMPLETED_DIR" ]; }; then
            echo "::error title=bad validate outputs::area is not alphanumeric or parent is not a roadmap root"
            exit 1
          fi
          dir="$PARENT/$AREA"
          entries="$(jq -ec --arg dir "$dir" '
            if (type == "object") and (keys == [$dir + "/PROGRESS.md", $dir + "/STATUS.md"])
               and all(.[]; type == "string" and test("^[0-9a-f]{40}$"))
            then [to_entries[] | {path: .key, mode: "100644", type: "blob", sha: .value}]
            else error("the validated blobs are not exactly this area'"'"'s two files") end' <<< "$BLOBS")"

          # What the verdict read from `main`, as of a given commit. Each path is asked for by name, so
          # a missing file is a definite "absent" (a first report has no STATUS.md or PROGRESS.md yet)
          # and any other failure fails, rather than reading as "unchanged". The cadence date is the
          # collector's own query (`last_commit_date`).
          blob_at() {
            local out
            if out="$(gh api "repos/$REPO/contents/$2?ref=$1" --jq .sha 2> lookup.err)"; then
              [[ "$out" =~ ^[0-9a-f]{40}$ ]] || return 1
              echo "$out"
            elif grep -q 'HTTP 404' lookup.err; then
              echo absent
            else
              cat lookup.err >&2
              return 1
            fi
          }
          read_by_verdict() {
            local status progress readme changed
            status="$(blob_at "$1" "$dir/STATUS.md")" || return 1
            progress="$(blob_at "$1" "$dir/PROGRESS.md")" || return 1
            readme="$(blob_at "$1" "$dir/README.md")" || return 1
            changed="$(gh api "repos/$REPO/commits?sha=$1&path=$dir/PROGRESS.md&per_page=1" \
                         --jq '.[0].commit.committer.date // "never"')" || return 1
            echo "STATUS.md=$status PROGRESS.md=$progress README.md=$readme changed=$changed"
          }
          validated="$(read_by_verdict "$MAIN_SHA")"
          printf 'validated against %s\n' "$validated"

          # Message written here rather than taken from the pull request: the title is mutable and
          # attacker-influenced, and the `progress:` prefix is load-bearing (the daily cadence check
          # finds the last update by scanning commit subjects for it).
          message="$(printf 'progress: %s report\n\nValidated head %s against main %s.\nCloses #%s.\n' \
            "$AREA" "$HEAD_SHA" "$MAIN_SHA" "$PR")"

          base="$MAIN_SHA"
          landed=false
          for _ in 1 2 3 4 5; do
            base_tree="$(gh api "repos/$REPO/git/commits/$base" --jq .tree.sha)"
            tree="$(jq -n --arg base "$base_tree" --argjson entries "$entries" \
                      '{base_tree: $base, tree: $entries}' \
                    | gh api -X POST "repos/$REPO/git/trees" --input - --jq .sha)"
            commit="$(gh api -X POST "repos/$REPO/git/commits" \
              -f message="$message" -f tree="$tree" -f parents[]="$base" --jq .sha)"
            printf 'built %s (tree %s, parent %s)\n' "${commit:0:7}" "${tree:0:7}" "${base:0:7}"

            # force=false is the compare-and-swap. It fails if main is no longer at `base`, because
            # then this commit is not a fast-forward of it.
            #
            # A failed PATCH is ambiguous on its own: the update may have been applied server-side
            # and the response lost. Believing "it failed" in that case would leave the report on
            # main with its pull request still open, which the planner then treats as permanently in
            # flight. So on any error the ref is re-read and the cases are distinguished explicitly.
            if gh api -X PATCH "repos/$REPO/git/refs/heads/main" \
                 -f sha="$commit" -F force=false > /dev/null 2> update.err; then
              landed=true
              break
            fi
            after="$(gh api "repos/$REPO/commits/main" --jq .sha || echo unknown)"
            if ! [[ "$after" =~ ^[0-9a-f]{40}$ ]] || [ "$after" = "$base" ]; then
              echo "::warning title=not landed::the update failed and main is ${after:0:7}"
              cat update.err
              break
            fi
            # The update may have applied with its response lost, and something else landed on top
            # before the re-read. Then our commit is in main's history, and it HAS landed.
            if [ "$after" = "$commit" ] || [ "$(gh api "repos/$REPO/compare/$commit...$after" \
                   --jq .status || echo unknown)" = ahead ]; then
              echo "::notice::the update landed despite the error response"
              landed=true
              break
            fi
            if ! now="$(read_by_verdict "$after")"; then
              echo "::warning title=not landed::could not re-read $dir on main ${after:0:7}"
              break
            fi
            if [ "$now" != "$validated" ]; then
              echo "::warning title=area changed::$dir on main is now $now; this report was not landed"
              break
            fi
            printf 'main moved %s -> %s without touching %s; rebuilding on it\n' \
              "${base:0:7}" "${after:0:7}" "$dir"
            base="$after"
          done
          echo "landed=$landed" >> "$GITHUB_OUTPUT"
          if [ "$landed" != "true" ]; then
            exit 0
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf 'main advanced %s -> %s\n' "${base:0:7}" "${commit:0:7}"

      # The content is on main, but the pull request is not "merged" in GitHub's sense, so close it
      # explicitly. Leaving it open would make the next planning run treat the area as permanently in
      # flight -- the window can never be revalidated, because main has moved past it.
      #
      # Closing comes FIRST and is retried; the comment and the branch deletion are cosmetic and must
      # never be the reason the pull request stays open. The step also fails loudly if the close did
      # not take, because a stranded open pull request needs a human.
      - name: Close the pull request now its content has landed
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.land.outputs.commit }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            state="$(gh pr view "$PR" --repo "$REPO" --json state --jq .state || echo UNKNOWN)"
            if [ "$state" = "CLOSED" ] || [ "$state" = "MERGED" ]; then
              printf 'pull request #%s is %s\n' "$PR" "$state"
              break
            fi
            gh pr close "$PR" --repo "$REPO" || true
            sleep "$attempt"
          done
          state="$(gh pr view "$PR" --repo "$REPO" --json state --jq .state || echo UNKNOWN)"
          if [ "$state" != "CLOSED" ] && [ "$state" != "MERGED" ]; then
            echo "::error title=pull request stranded::#$PR is $state but its content landed as $COMMIT"
            exit 1
          fi
          # Best effort from here: neither of these affects correctness.
          gh pr comment "$PR" --repo "$REPO" \
            --body "Landed on \`main\` as $COMMIT by compare-and-swap of the validated files." || true
          # Delete the source branch ONLY when it is in this repository. Branch names are a pure
          # function of the window, so a fork's branch has the same name as the canonical one would:
          # deleting `repos/$REPO/git/refs/heads/<name>` after landing a FORK pull request would
          # delete an unrelated canonical branch that happens to share the name.
          head_repo="$(gh pr view "$PR" --repo "$REPO" --json headRepository,headRepositoryOwner \
                       --jq '(.headRepositoryOwner.login // "") + "/" + (.headRepository.name // "")')"
          head_ref="$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq .headRefName)"
          if [ "$head_repo" = "$REPO" ] && [ -n "$head_ref" ]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$head_ref" > /dev/null 2>&1 || true
          else
            echo "head is in $head_repo, not $REPO; leaving its branch alone"
          fi

      # Landing moved the area's cursor, and a report can only land if its window starts at its
      # directory's cursor on `main`. So another open report for this area that starts anywhere else
      # can never land; close it, whoever opened it. This is not one operator vetoing another:
      # whether a report can land depends only on `main`, which is what this reads. Nothing else
      # would close these: the gate only runs on events for a pull request itself, and the worker
      # sweeps only its own operator's reports.
      #
      # Each candidate is judged against the cursor of the directory IT changes, read from `main`
      # now, not against the window that just landed. An area name can exist under both
      # `TauCetiRoadmap/` and `Completed/`, with separate cursors; and `main` may have moved again
      # since this landing. Candidates are listed BEFORE any cursor is read, so a listed report
      # can only start at a cursor `main` has already reached: if it is still current it is kept.
      # Anything ambiguous -- changes outside one directory, no status on `main`, an unreadable
      # cursor -- is left alone.
      #
      # Best effort throughout (`set +e`). The landing is done and recorded, and a report left open
      # is only clutter, so a failure here warns rather than turning the run red.
      - name: Close reports that can no longer land
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          AREA: ${{ needs.validate.outputs.area }}
          COMMIT: ${{ steps.land.outputs.commit }}
          ROADMAP_DIR: ${{ needs.validate.outputs.roadmap_dir }}
          COMPLETED_DIR: ${{ needs.validate.outputs.completed_dir }}
        run: |
          set +e -uo pipefail
          if ! [[ "$AREA" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::warning title=no sweep::area unknown; not closing other reports"
            exit 0
          fi
          if ! gh api --paginate --slurp "repos/$REPO/pulls?state=open&per_page=100" > open.json \
             || ! jq -r --arg repo "$REPO" --arg area "$AREA" --argjson pr "$PR" '
                    .[][]
                    | select(.number != $pr)
                    | select(.base.ref == "main" and .base.repo.full_name == $repo)
                    | (.head.ref
                       | capture("^progress/(?<from>[0-9a-f]{7})-[0-9a-f]{7}/(?<area>[A-Za-z0-9]+)$"))
                        as $b
                    | select($b.area == $area)
                    | "\(.number) \($b.from)"' open.json > candidates.txt; then
            echo "::warning title=no sweep::could not list open pull requests"
            exit 0
          fi
          while read -r number from; do
            # The one directory this report changes, or nothing.
            dir="$(gh api --paginate --slurp "repos/$REPO/pulls/$number/files" \
                   | jq -r --arg area "$AREA" --arg active "$ROADMAP_DIR" --arg completed "$COMPLETED_DIR" '
                       [.[][].filename
                        | (capture("^(?<parent>.+)/(?<area>[A-Za-z0-9]+)/(STATUS|PROGRESS)\\.md$")
                           // {parent: "", area: ""})
                        | if (.parent == $active or .parent == $completed) and .area == $area
                          then .parent + "/" + .area else "" end] | unique
                       | if length == 1 and (.[0] | endswith("/" + $area)) then .[0] else "" end')"
            if [ -z "$dir" ]; then
              echo "#$number: not confined to one $AREA directory; leaving it"
              continue
            fi
            cursor="$(gh api "repos/$REPO/contents/$dir/STATUS.md?ref=main" \
                        -H "Accept: application/vnd.github.raw" \
                      | sed -n '1s/^<!--tauceti-status:v1 \(.*\)-->$/\1/p' \
                      | jq -r '.to_sha // ""')"
            if ! [[ "$cursor" =~ ^[0-9a-f]{40}$ ]]; then
              echo "#$number: no readable cursor for $dir on main; leaving it"
              continue
            fi
            if [ "$from" = "${cursor:0:7}" ]; then
              echo "#$number starts at the current $dir cursor; leaving it"
              continue
            fi
            printf 'closing #%s: its window starts at %s, the %s cursor is %s\n' \
              "$number" "$from" "$dir" "${cursor:0:7}"
            fmt='This report can no longer land. Its window starts at `%s`, but the `%s` cursor on'
            fmt="$fmt"' `main` is now `%s` (#%s landed as %s), so the gate can never append it.'
            body="$(printf "$fmt" "$from" "$dir" "${cursor:0:7}" "$PR" "$COMMIT")"
            gh pr close "$number" --repo "$REPO" --comment "$body" \
              || echo "::warning title=not closed::could not close #$number"
          done < candidates.txt
