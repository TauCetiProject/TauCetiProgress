[project]
name = "tauceti-progress"
version = "0.1.0"
description = "Decide, generate, and publish per-roadmap progress reports for Tau Ceti."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# TauCetiTools supplies the shared configuration. Provider access still uses git/gh
# and the standard library.
dependencies = ["tauceti-tools @ git+https://github.com/TauCetiProject/TauCetiTools@4c7381d3a47fd9b9f7aa786dd2a28c375e36fee6"]

[project.scripts]
tauceti-progress = "progress.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["progress"]

[tool.setuptools.package-data]
# Inside the package, not `../prompts`: setuptools does not reliably ship files from outside the
# package directory, and the worker fetches these prompts from an installed build rather than from a
# checkout, so a prompt that does not install is a prompt that does not exist.
progress = ["prompts/*.md"]
